# roles/zabbix_server/handlers/main.yml
---
- name: restart zabbix-server
  service:
    name: zabbix-server
    state: restarted

- name: restart nginx
  service:
    name: nginx
    state: restarted

- name: restart php-fpm
  service:
    name: php8.1-fpm
    state: restarted

- name: restart zabbix-agent2
  service:
    name: zabbix-agent2
    state: restarted
