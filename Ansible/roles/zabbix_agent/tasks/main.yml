---
- name: Скачать пакет zabbix-release
  get_url:
    url: https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_7.0-1+ubuntu22.04_all.deb
    dest: /tmp/zabbix-release.deb
    mode: '0644'

- name: Установить zabbix-release
  apt:
    deb: /tmp/zabbix-release.deb

- name: Обновить apt cache
  apt:
    update_cache: true

- name: Установить Zabbix Agent2
  apt:
    name: zabbix-agent2
    state: present

- name: Настроить Zabbix Agent2
  lineinfile:
    path: /etc/zabbix/zabbix_agent2.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - regexp: '^#?\s*Server='
      line: "Server={{ zabbix_server_ip }}"
    - regexp: '^#?\s*ServerActive='
      line: "ServerActive={{ zabbix_server_ip }}"
    - regexp: '^#?\s*Hostname='
      line: "Hostname={{ inventory_hostname }}"
  notify: restart zabbix-agent2

- name: Запустить Zabbix Agent2
  service:
    name: zabbix-agent2
    state: started
    enabled: true
